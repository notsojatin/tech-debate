<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Debate Arena — AI Evidence-Backed Debates</title>
    <script>
      // Apply a saved light/night choice before first paint; "system" leaves it to prefers-color-scheme.
      try {
        var t = localStorage.getItem('paper-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
