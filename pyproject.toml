[project]
name = "tech-debate"
version = "0.1.0"
description = "Two open models debate a tech topic with web evidence; a third judges; Kokoro reads it aloud."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
