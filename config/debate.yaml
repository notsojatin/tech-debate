# Debate configuration. Service URLs come from the environment (see .env).

models:
  pro:
    name: qwen3:4b
    think: false             # sent as Ollama's `think`; false keeps reasoning out of the transcript and TTS
    temperature: 0.7
  con:
    name: gemma3:4b
    temperature: 0.7
  judge:
    name: llama3.2:3b
    temperature: 0.0

llm:
  seed: 42
  # Fits the largest debate (10 rebuttal rounds of long speeches): the judge reads the whole transcript plus the
  # cited evidence, about 10k tokens. One value for every call, so Ollama never reloads a model to resize it.
  num_ctx: 16384
  num_predict: 2048          # output cap per call; speeches need ~400 tokens, the rest is room for reasoning
  timeout_s: 600
  keep_alive: 5m

debate:
  rebuttal_rounds: 2         # default; each debate may choose 1-10
  turn_retries: 3
  speech_length: standard    # default; each debate may choose any preset below
  speech_lengths:            # word limits per turn
    short:    {opening: 80,  rebuttal: 70,  closing: 25}
    standard: {opening: 120, rebuttal: 110, closing: 30}
    long:     {opening: 200, rebuttal: 180, closing: 40}
  novelty_threshold: 0.6     # token-Jaccard; at or above this a new_point counts as a repeat
  quote_match_ratio: 0.85
  stance_check: true         # judge model checks each turn argues its assigned side; off-side turns retry

research:
  queries_per_side: 3
  results_per_query: 4
  fetch_per_query: 2
  snippet_chars: 600
  evidence_per_side_in_prompt: 6
  fetch_timeout_s: 10
  search_timeout_s: 15
  max_page_bytes: 2000000

voices:
  pro: am_michael
  con: bf_emma
  narrator: bm_george
  speed: 1.0

render:
  sentence_gap_ms: 150
  speaker_gap_ms: 700
  mp3_bitrate: 128k

demo_topic: "Monorepos are better than polyrepos for most engineering teams"

preset_topics:
  - "Monorepos are better than polyrepos for most engineering teams"
  - "Rust is better than Go for command-line tools"
  - "Kubernetes is overkill for most startups"
  - "Microservices do more harm than good for mid-sized engineering teams"
  - "SQLite on a single node is enough for most production web apps"
  - "Open-weight local LLMs are better than proprietary APIs for enterprise teams"
  - "Server-side rendering is better than single-page applications for modern web apps"
  - "ORMs do more harm than good in production backend systems"
